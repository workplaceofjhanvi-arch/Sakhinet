<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakhinet College Dashboard</title>
<style>
  body { margin: 0; font-family: system-ui, Segoe UI, sans-serif; background: #FBF3E4; color: #4A1A22; }
  .strip { height: 10px; background: #8E1F3A; border-bottom: 6px solid #E8A31B; }
  header { padding: 20px 32px; }
  header h1 { margin: 0; font-size: 26px; color: #8E1F3A; }
  header p { margin: 4px 0 0; color: #8C6A5E; }
  main { padding: 0 32px 24px; max-width: 1100px; margin: 0 auto; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .card { background: #FFFDF8; border: 1px solid #EBD9BE; border-radius: 14px; padding: 18px; }
  .kpi .num { font-size: 36px; font-weight: 800; color: #8E1F3A; }
  .kpi .label { color: #8C6A5E; font-size: 14px; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }
  h2 { font-size: 16px; margin: 0 0 14px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; }
  .row .name { width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .track { flex: 1; background: #F3DDD0; border-radius: 6px; height: 14px; }
  .row .bar { background: #2F6B4F; height: 14px; border-radius: 6px; }
  .row .val { width: 36px; text-align: right; font-weight: 700; }
  .low .bar { background: #C0262D; }
  .tag { font-size: 12px; color: #C0262D; font-weight: 700; }
  .empty { color: #8C6A5E; font-size: 14px; }
  footer { text-align: center; color: #8C6A5E; font-size: 13px; padding: 20px; }
</style>
</head>
<body>
<div class="strip"></div>
<header>
  <h1>Sakhinet College Dashboard</h1>
  <p>ABVGIET Pragatinagar, Shimla. Anonymous totals only, no student names.</p>
</header>
<main>
  <div class="kpis">
    <div class="card kpi"><div class="num" id="total">-</div><div class="label">Total requests</div></div>
    <div class="card kpi"><div class="num" id="done">-</div><div class="label">Completed</div></div>
    <div class="card kpi"><div class="num" id="rate">-</div><div class="label">Completion rate</div></div>
    <div class="card kpi"><div class="num" id="avg">-</div><div class="label">Average response (minutes)</div></div>
  </div>
  <div class="grid">
    <div class="card"><h2>Requests by location</h2><div id="loc"></div></div>
    <div class="card"><h2>Requests by type</h2><div id="type"></div></div>
    <div class="card"><h2>Requests per day</h2><div id="day"></div></div>
    <div class="card"><h2>Route used</h2><div id="route"></div></div>
    <div class="card"><h2>Dispenser stock</h2><div id="disp"></div></div>
  </div>
</main>
<footer id="updated"></footer>
<script>
  var params = new URLSearchParams(location.search);
  var COLLEGE_ID = params.get('college_id') || '11111111-1111-1111-1111-111111111111';

  function bars(id, obj) {
    var el = document.getElementById(id);
    var keys = Object.keys(obj);
    if (!keys.length) { el.innerHTML = '<div class="empty">No data yet</div>'; return; }
    var max = Math.max.apply(null, keys.map(function (k) { return obj[k]; }));
    el.innerHTML = keys.map(function (k) {
      var w = Math.round((obj[k] / max) * 100);
      return '<div class="row"><div class="name" title="' + k + '">' + k + '</div><div class="track"><div class="bar" style="width:' + w + '%"></div></div><div class="val">' + obj[k] + '</div></div>';
    }).join('');
  }

  function load() {
    fetch('/api/dashboard?college_id=' + COLLEGE_ID)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        document.getElementById('total').textContent = d.total_requests;
        document.getElementById('done').textContent = d.completed_requests;
        document.getElementById('rate').textContent = d.completion_rate + '%';
        document.getElementById('avg').textContent = d.avg_response_minutes === null ? '-' : d.avg_response_minutes;
        bars('loc', d.by_location);
        bars('type', d.by_type);
        bars('day', d.by_day);
        bars('route', d.by_route);
        var disp = document.getElementById('disp');
        if (!d.dispensers.length) {
          disp.innerHTML = '<div class="empty">No dispensers added yet</div>';
        } else {
          disp.innerHTML = d.dispensers.map(function (x) {
            var low = x.stock_level <= 5;
            var w = Math.min(100, x.stock_level * 5);
            return '<div class="row ' + (low ? 'low' : '') + '"><div class="name">' + x.location + '</div><div class="track"><div class="bar" style="width:' + w + '%"></div></div><div class="val">' + x.stock_level + '</div>' + (low ? '<div class="tag">LOW</div>' : '') + '</div>';
          }).join('');
        }
        document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString() + '. Refreshes every 10 seconds.';
      })
      .catch(function () {
        document.getElementById('updated').textContent = 'Could not load data. Is the server running?';
      });
  }

  load();
  setInterval(load, 10000);
</script>
</body>
</html>
